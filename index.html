<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>So long, and thanks for all the requests</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <style>
      :root {
        --bg: #fdf6ec;
        --bubble-bg: #ffffff;
        --bubble-border: #e0a458;
        --text: #5a4a2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: var(--bg);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
      }

      .farewell {
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        max-width: 900px;
        width: 100%;
      }

      .speech-bubble {
        position: relative;
        background: var(--bubble-bg);
        border: 3px solid var(--bubble-border);
        border-radius: 1.5rem;
        padding: 2rem 2.5rem;
        flex: 1 1 auto;
        max-width: 460px;
      }

      .speech-bubble h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        line-height: 1.25;
      }

      /* Bubble tail pointing left toward the giraffe (desktop/tablet) */
      .speech-bubble::after {
        content: "";
        position: absolute;
        top: 50%;
        left: -22px;
        transform: translateY(-50%);
        border-width: 12px 22px 12px 0;
        border-style: solid;
        border-color: transparent var(--bubble-border) transparent transparent;
      }

      .speech-bubble::before {
        content: "";
        position: absolute;
        top: 50%;
        left: -17px;
        transform: translateY(-50%);
        border-width: 10px 18px 10px 0;
        border-style: solid;
        border-color: transparent var(--bubble-bg) transparent transparent;
        z-index: 1;
      }

      .giraffe {
        width: 100%;
        max-width: 260px;
        height: auto;
        flex: 0 0 auto;
      }

      /* Mobile: stack vertically with the bubble on top */
      @media (max-width: 600px) {
        .farewell {
          flex-direction: column;
          gap: 1.5rem;
        }

        .speech-bubble {
          max-width: 100%;
          text-align: center;
        }

        /* Point the tail downward toward the giraffe below */
        .speech-bubble::after {
          top: auto;
          left: auto;
          right: 50%;
          bottom: -22px;
          transform: translateX(50%);
          border-width: 22px 12px 0 12px;
          border-color: var(--bubble-border) transparent transparent transparent;
        }

        .speech-bubble::before {
          top: auto;
          left: auto;
          right: 50%;
          bottom: -17px;
          transform: translateX(50%);
          border-width: 18px 10px 0 10px;
          border-color: var(--bubble-bg) transparent transparent transparent;
        }
      }
    </style>
  </head>
  <body>
    <main class="farewell">
      <div class="speech-bubble">
        <h1>So long, and thanks for all the requests</h1>
      </div>
      <img
        class="giraffe"
        src="graff.png"
        alt="A cartoon illustration of Graff the Giraffe, a tall, cheerful giraffe with a yellow coat and brown spots"
      />
    </main>
  </body>
</html>
